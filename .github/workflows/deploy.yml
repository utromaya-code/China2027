name: Build & Deploy

# Сайт публикуется с основной ветки. Разовую публикацию можно запустить
# вручную через workflow_dispatch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci
        env:
          # Playwright нужен только для локальных проверок скриншотами.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Проверить типы
        run: npm run typecheck

      - name: Собрать сайт
        run: npm run build
        env:
          # Для своего домена задайте переменные репозитория SITE_URL и BASE_PATH
          # (Settings → Secrets and variables → Actions → Variables).
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          PUBLIC_LEAD_FORM_ENDPOINT: ${{ secrets.PUBLIC_LEAD_FORM_ENDPOINT }}

      # enablement: true пробует включить GitHub Pages сам. Если прав не хватит,
      # включите один раз вручную: Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
